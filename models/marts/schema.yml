
models:
  - name: dim_product_supplies
    config:
      access: public 
  - name: fct_orders
    description: This model provides a comprehensive view of orders, including financial details and customer and location information. It is designed to facilitate analysis of order trends, profitability, and customer behavior over time.
    config:
      access: public 
    columns:
      - name: order_id
        description: A unique identifier for each order.
      - name: location_id
        description: The identifier for the location where the order was placed.
      - name: customer_id
        description: The identifier for the customer who placed the order.
      - name: order_total
        description: The total amount for the order, including all items and taxes.
      - name: tax_paid
        description: The total tax amount paid for the order.
      - name: net_profit_per_order
        description: The profit generated from the order after deducting costs.
      - name: ordered_at
        description: The timestamp when the order was placed.
      - name: customer_name
        description: The name of the customer who placed the order.
      - name: location_name
        description: The name of the location where the order was placed.
      - name: tax_rate
        description: The tax rate applied to the order.
      - name: opened_date
        description: The date when the order was opened.
      - name: ordered_month
        description: The month when the order was placed.
      - name: ordered_day
        description: The day when the order was placed.
      - name: ordered_year
        description: The year when the order was placed.

  - name: fct_order_items
    config:
      access: public
  - name: dim_common_orders
    config:
      access: public
  